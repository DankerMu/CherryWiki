events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # --- Security Headers ---
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Dev mode: relaxed CSP for Vite HMR inline scripts; tighten in production.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self'; frame-ancestors 'self';" always;
  # 生产部署启用 HTTPS 后取消注释：
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    # --- Phase 1: Cherry Web 前端 ---
    location / {
      proxy_pass http://cherry-web:5173;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # --- Stage 2: Block external access to Internal Worker API ---
    location /api/internal/ {
      return 403 '{"error": "Internal API is not accessible externally."}';
      add_header Content-Type application/json always;
    }

    # --- Phase 1: Cherry API ---
    location /api/ {
      proxy_pass http://cherry-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Phase 1: Chat SSE 流式端点 ---
    location /api/chat/ {
      proxy_pass http://cherry-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # --- Phase 1: Docmost 不可用，返回明确提示 ---
    location /docmost/ {
      return 503 '{"error": "Docmost is not available in Phase 1. It will be enabled in Phase 2."}';
      add_header Content-Type application/json always;
    }
  }
}
