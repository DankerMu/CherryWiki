services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cherrygraph
      POSTGRES_USER: cherrygraph
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cherrygraph -d cherrygraph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - url_fetch_private

  cherry-api:
    image: cherrywiki/api:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production

      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://cherrygraph:${POSTGRES_PASSWORD}@postgres:5432/cherrygraph
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cherrywiki.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-cherrywiki}
      WORKER_API_KEY: ${WORKER_API_KEY:?WORKER_API_KEY is required}
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-http://localhost:11434}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-4.1}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-large}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - default
      - url_fetch_private

  cherry-web:
    image: cherrywiki/web:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingestion-worker:
    image: cherrywiki/ingestion-worker:latest
    build:
      context: ./apps/ingestion-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=5g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CHERRY_API_URL: http://cherry-api:8080/api
      WORKER_API_KEY: ${WORKER_API_KEY:?WORKER_API_KEY is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-cherrywiki}
      INGESTION_TIMEOUT_SECONDS: ${INGESTION_TIMEOUT_SECONDS:-300}
      WORKER_HEALTH_PORT: 9091
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9091/health', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      cherry-api:
        condition: service_healthy
      minio:
        condition: service_healthy

  url-fetcher-worker:
    image: cherrywiki/url-fetcher-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: url-fetcher-worker
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      CHERRY_API_URL: http://cherry-api:8080/api
      WORKER_API_KEY: ${WORKER_API_KEY:?WORKER_API_KEY is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-cherrywiki}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-default}
      HTTP_PROXY: ${HTTP_PROXY:-http://egress-proxy:3128}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://egress-proxy:3128}
      NO_PROXY: ${NO_PROXY:-cherry-api,minio,localhost,127.0.0.1}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-30}
      URL_FETCH_MAX_RESPONSE_BYTES: ${URL_FETCH_MAX_RESPONSE_BYTES:-52428800}
      WORKER_HEALTH_PORT: 9092
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9092/health', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      cherry-api:
        condition: service_healthy
      minio:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    networks:
      - url_fetch_private

  egress-proxy:
    image: ubuntu/squid:latest
    restart: unless-stopped
    volumes:
      - ./ops/squid/squid.conf:/etc/squid/squid.conf:ro
    expose:
      - "3128"
    networks:
      - default
      - url_fetch_private

  indexer-worker:
    image: cherrywiki/indexer-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: indexer-worker
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production

      DATABASE_URL: postgresql://cherrygraph:${POSTGRES_PASSWORD}@postgres:5432/cherrygraph
      REDIS_URL: redis://redis:6379
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-http://localhost:11434}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-large}
      WORKER_HEALTH_PORT: 9093
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9093/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  graphify-worker:
    image: cherrywiki/graphify-worker:latest
    build:
      context: ./apps/graphify-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
    read_only: true
    tmpfs:
      - /tmp:size=1g
      - /work/graphify:size=2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://cherrygraph:${POSTGRES_PASSWORD}@postgres:5432/cherrygraph
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-http://localhost:11434}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      API_BASE_URL: http://cherry-api:8080
      GRAPHIFY_WORKDIR: /work/graphify
      GRAPHIFY_DEFAULT_MODE: ${GRAPHIFY_DEFAULT_MODE:-deep}
      GRAPHIFY_ENABLE_WIKI: ${GRAPHIFY_ENABLE_WIKI:-true}
      GRAPHIFY_TIMEOUT_SECONDS: ${GRAPHIFY_TIMEOUT_SECONDS:-3600}
      WORKER_HEALTH_PORT: 9094
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9094/health', timeout=5)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      cherry-api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-80}:80"
    volumes:
      - ./ops/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      cherry-web:
        condition: service_healthy
      cherry-api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
  url_fetch_private:
    internal: true
