name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: Node — Lint, Typecheck, Build, Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backup/restore shell regression
        run: bash scripts/__tests__/backup-restore.sh

      - name: Secret scanner self-test
        run: node scripts/secret-hygiene-scan.mjs --self-test

      - name: Secret hygiene scan
        run: pnpm secret:scan

      - name: Install URL fetcher Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/url-fetcher-worker/requirements.txt
          python -m pip install -e packages/python-worker-protocol

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: RAG fusion extension tests
        run: pnpm exec vitest run packages/rag-core/src/__tests__/graph-retrieval.test.ts packages/rag-core/src/__tests__/retrieval-engine.test.ts --config vitest.config.ts --passWithNoTests=false

      - name: Test with coverage
        env:
          URL_FETCHER_PYTHON: python
        run: pnpm test -- --coverage

      - name: Integration tests
        run: pnpm exec vitest run tests/integration/ --config vitest.config.ts --passWithNoTests=false

      - name: Security audit
        run: pnpm audit --audit-level=critical

  python-ci:
    name: Python — ${{ matrix.worker }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        worker: [graphify-worker, ingestion-worker, url-fetcher-worker]

    defaults:
      run:
        working-directory: apps/${{ matrix.worker }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ matrix.worker }}" = "ingestion-worker" ] || [ "${{ matrix.worker }}" = "url-fetcher-worker" ]; then
            pip install -e ../../packages/python-worker-protocol
          fi
          pip install ruff pytest pytest-asyncio

      - name: Test shared worker protocol
        if: matrix.worker == 'ingestion-worker'
        run: python -m pytest ../../packages/python-worker-protocol/tests -v

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Test
        run: python -m pytest tests/ -v

  validate:
    name: Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI schema
        run: pnpm exec redocly lint docs/schemas/openapi.yaml

      - name: Validate SQL schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libecpg-dev > /dev/null
          pip install -q 'pgsanity==0.2.9'
          pgsanity docs/schemas/schema.sql

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Production Compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          JWT_SECRET: ci-jwt-secret-minimum-32-characters
          ADMIN_PASSWORD: ci-admin-password
          MINIO_ACCESS_KEY: ci-minio-access-key
          MINIO_SECRET_KEY: ci-minio-secret-key
          WORKER_API_KEY: ci-worker-api-key
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Verify Dockerfiles build (syntax only)
        run: |
          status=0
          for f in apps/*/Dockerfile ops/agent/Dockerfile; do
            if [ -f "$f" ]; then
              echo "Checking $f..."
              case "$f" in
                apps/ingestion-worker/Dockerfile|apps/url-fetcher-worker/Dockerfile)
                  docker buildx build --check -f "$f" . || status=1
                  ;;
                *)
                  docker buildx build --check -f "$f" "$(dirname "$f")" || status=1
                  ;;
              esac
            fi
          done
          exit $status

      - name: Verify root Dockerfile production targets (syntax only)
        run: |
          status=0
          for target in api web ingestion-worker url-fetcher-worker indexer-worker; do
            echo "Checking Dockerfile target $target..."
            docker buildx build --check -f Dockerfile --target "$target" . || status=1
          done
          exit $status

  e2e:
    name: E2E — Phase 1 Launch Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [node-ci, python-ci]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cherry
          POSTGRES_PASSWORD: cherry
          POSTGRES_DB: cherrywiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cherry"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cherry:cherry@localhost:5432/cherrywiki_test
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          until curl -sf http://localhost:9000/minio/health/live; do sleep 1; done

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: pnpm db:migrate

      - name: E2E integration tests
        run: pnpm exec vitest run tests/integration/ --config vitest.config.ts --passWithNoTests=false
        env:
          E2E: 'true'
