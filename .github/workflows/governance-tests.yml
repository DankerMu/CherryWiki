name: Governance Tests

on:
  pull_request:
    paths:
      - 'apps/api/src/governance/**'
      - 'apps/api/src/feedback/**'
      - 'packages/graph-core/src/**'
      - 'tests/integration/governance-*.test.ts'
      - 'tests/integration/feedback-*.test.ts'
      - '.github/workflows/governance-tests.yml'

permissions:
  contents: read

concurrency:
  group: governance-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-tests:
    name: Governance — Knowledge Curation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Governance unit tests
        run: |
          pnpm exec vitest run \
            apps/api/src/governance/__tests__/ \
            apps/api/src/feedback/__tests__/ \
            --config vitest.config.ts
