name: Agent Tests

on:
  pull_request:
    paths:
      - apps/api/src/agent/**
      - apps/api/src/chat/**
      - tools/cherrydb/**
      - tools/cherrywiki/**
      - tests/integration/agent*.test.ts
      - tests/integration/cherrydb-e2e.test.ts
      - .github/workflows/agent-tests.yml

permissions:
  contents: read

concurrency:
  group: agent-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-node-tests:
    name: Agent module unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Agent unit tests
        run: pnpm exec vitest run apps/api/src/agent/__tests__/ --config vitest.config.ts --passWithNoTests=false

  cherrydb-python-tests:
    name: cherrydb Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install cherrydb test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/cherrydb/requirements.txt
          pip install pytest

      - name: Run cherrydb tests
        run: python -m pytest tools/cherrydb/tests -v
