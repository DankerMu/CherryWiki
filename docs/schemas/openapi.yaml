                      type: object
                      properties:
                        check_id: { type: string }
                        space_id: { type: string }
                        status: { type: string, enum: [passed, failed, running] }
                        checked_at: { type: string, format: date-time }
                        issues_found: { type: integer }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/spaces/{space_id}/rebuild-index:
    post:
      summary: Rebuild space index
      tags: [Admin]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: [full, incremental], default: full }
                reason: { type: string }
      responses:
        '202':
          description: Rebuild job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Rebuild already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/retrieval-traces/{trace_id}:
    get:
      summary: Get retrieval trace
      tags: [Admin]
      parameters:
        - { name: trace_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Retrieval trace
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RetrievalTrace' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # --- Worker (Internal) ---
  /internal/jobs/pending:
    get:
      summary: Poll pending jobs by type
      tags: [Worker]
      security:
        - workerApiKey: []
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ingestion, graphify, reindex, rebuild] } }
        - { name: limit, in: query, schema: { type: integer, default: 1, minimum: 1, maximum: 10 } }
      responses:
        '200':
          description: Pending jobs (empty array if none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Job' } }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /internal/jobs/{job_id}/progress:
    patch:
      summary: Report job progress
      tags: [Worker]
      security:
        - workerApiKey: []
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, percent]
              properties:
                worker_id: { type: string }
                percent: { type: integer, minimum: 0, maximum: 100 }
                stage: { type: string }
      responses:
        '200':
          description: Progress updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { job_id: { type: string }, status: { type: string } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Job not owned by this worker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /internal/jobs/{job_id}/complete:
    patch:
      summary: Report job completion
      tags: [Worker]
      security:
        - workerApiKey: []
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                result_json: { type: object }
      responses:
        '200':
          description: Job marked completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { job_id: { type: string }, status: { type: string, enum: [succeeded] } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Job not owned by this worker or not in running state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /internal/jobs/{job_id}/fail:
    patch:
      summary: Report job failure
      tags: [Worker]
      security:
        - workerApiKey: []
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id, error_json]
              properties:
                worker_id: { type: string }
                error_json: { type: object, properties: { code: { type: string }, message: { type: string }, stack: { type: string } } }
                retryable: { type: boolean, default: true }
      responses:
        '200':
          description: Job marked failed (may be retried if retryable and attempts remain)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { job_id: { type: string }, status: { type: string }, will_retry: { type: boolean } } }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /internal/workers/heartbeat:
    post:
      summary: Worker heartbeat
      tags: [Worker]
      security:
        - workerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: { type: string }
                active_jobs: { type: array, items: { type: string } }
                system_info: { type: object, properties: { cpu_percent: { type: number }, memory_mb: { type: integer } } }
      responses:
        '200':
          description: Heartbeat acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ack: { type: boolean }
                      cancel_requested: { type: array, items: { type: string }, description: Jobs the server wants the worker to cancel }

  # --- Bridge (Internal) ---
  /internal/docmost/events/page-saved:
    post:
      summary: Docmost page saved event
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { $ref: '#/components/parameters/bridgeEventId' }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocmostPageSavedEvent' }
      responses:
        '200':
          description: Event accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  deduplicated: { type: boolean }
                  sync_job_id: { type: string }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/RateLimitError' }

  /internal/docmost/events/page-deleted:
    post:
      summary: Docmost page deleted event
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { $ref: '#/components/parameters/bridgeEventId' }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      responses:
        '200':
          description: Event accepted

  /internal/docmost/events/attachment-created:
    post:
      summary: Docmost attachment created event
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { $ref: '#/components/parameters/bridgeEventId' }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocmostAttachmentEvent' }
      responses:
        '200':
          description: Event accepted

  /internal/bridge/pages/{docmost_page_id}/export:
    get:
      summary: Export page from Docmost Fork
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { name: docmost_page_id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, default: markdown } }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      responses:
        '200':
          description: Page content
          content:
            application/json:
              schema:
                type: object
                properties:
                  docmost_page_id: { type: string }
                  title: { type: string }
                  format: { type: string }
                  content_markdown: { type: string }
                  updated_at: { type: string, format: date-time }
                  content_hash: { type: string }

  /internal/bridge/pages/{docmost_page_id}/import:
    put:
      summary: Import page to Docmost Fork
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { name: docmost_page_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docmost_space_id, title, content_markdown]
              properties:
                docmost_space_id: { type: string }
                title: { type: string }
                content_markdown: { type: string }
                source: { type: string, enum: [graphify, human, import] }
                page_version_id: { type: string }
                overwrite_policy: { type: string, enum: [replace_all, preserve_human_blocks] }
      responses:
        '200':
          description: Import accepted

  /internal/bridge/attachments/{attachment_id}/download:
    get:
      summary: Download attachment from Docmost Fork
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { name: attachment_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      responses:
        '200':
          description: Attachment binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /internal/bridge/spaces/{docmost_space_id}/sync-status:
    get:
      summary: Get Docmost space sync status
      tags: [Bridge]
      security:
        - bridgeBearer: []
          bridgeHmacAuth: []
      parameters:
        - { name: docmost_space_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/bridgeTimestamp' }
        - { $ref: '#/components/parameters/bridgeNonce' }
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                type: object
                properties:
                  docmost_space_id: { type: string }
                  space_id: { type: string }
                  status: { type: string, enum: [healthy, degraded, error] }
                  pending_events: { type: integer }
                  last_success_at: { type: string, format: date-time }

  /internal/bridge/health:
    get:
      summary: Bridge health check
      tags: [Bridge]
      security:
        - bridgeBearer: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [healthy, unhealthy] }
                  version: { type: string }

  # ===== Phase 4: Knowledge Governance (Stage 13) =====

  # --- Feedback ---
  /spaces/{space_id}/feedback:
    post:
      summary: Submit feedback
      description: |
        Submit feedback on a Chat answer or Wiki page. feedback_type distinguishes
        incorrect / missing / outdated / other.
      tags: [Feedback]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFeedbackRequest' }
      responses:
        '201':
          description: Feedback submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FeedbackItem' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/feedback:
    get:
      summary: List feedback items
      tags: [Feedback]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { $ref: '#/components/parameters/sortParam' }
        - { name: status, in: query, schema: { type: string, enum: [open, in_review, resolved, rejected] } }
        - { name: feedback_type, in: query, schema: { type: string, enum: [incorrect, missing, outdated, citation_error, other] } }
        - { name: space_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Feedback items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/FeedbackItem' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/feedback/{feedback_id}/resolve:
    patch:
      summary: Resolve feedback item
      description: |
        Mark feedback as resolved or rejected. When resolved with action=edit,
        the associated Wiki page edit triggers a reindex job automatically.
      tags: [Feedback]
      parameters:
        - { name: feedback_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveFeedbackRequest' }
      responses:
        '200':
          description: Feedback resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FeedbackItem' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Feedback already resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # --- Governance ---
  /admin/governance/low-confidence-edges:
    get:
      summary: List low-confidence edges for review
      description: |
        Returns graph edges with effective_confidence_score below the configurable
        threshold (default 0.5). Ordered by score ascending so weakest edges surface first.
      tags: [Governance]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { name: space_id, in: query, schema: { type: string } }
        - { name: threshold, in: query, schema: { type: number, default: 0.5, minimum: 0, maximum: 1 }, description: "Maximum effective_confidence_score to include" }
        - { name: confidence_label, in: query, schema: { type: string, enum: [INFERRED, AMBIGUOUS, LOW] } }
      responses:
        '200':
          description: Low-confidence edges
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/GovernanceEdge' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/governance/edges/{edge_id}/review:
    patch:
      summary: Review a graph edge
      description: |
        Approve or reject a low-confidence edge. Approval upgrades confidence_label
        to CONFIRMED. Rejection soft-deletes the edge. Both actions trigger a reindex.
      tags: [Governance]
      parameters:
        - { name: edge_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewEdgeRequest' }
      responses:
        '200':
          description: Edge reviewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GovernanceEdge' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Edge already reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/governance/duplicate-suggestions:
    get:
      summary: List duplicate page / node suggestions
      description: |
        Detects potential duplicate graph nodes based on stable_key and norm_label
        similarity. Returns pairs with a similarity score.
      tags: [Governance]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { name: space_id, in: query, schema: { type: string } }
        - { name: min_similarity, in: query, schema: { type: number, default: 0.8, minimum: 0, maximum: 1 } }
      responses:
        '200':
          description: Duplicate suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DuplicateSuggestion' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/governance/merge:
    post:
      summary: Merge duplicate nodes
      description: |
        Merge from_page_id into to_page_id. Creates a graph_node_merges record,
        re-points edges, merges wiki pages, and triggers reindex.
      tags: [Governance]
      parameters:
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MergeNodesRequest' }
      responses:
        '200':
          description: Nodes merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/NodeMergeResult' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Merge already performed or circular merge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/governance/conflicts:
    get:
      summary: Detect knowledge conflicts
      description: |
        Detects contradictory edges between the same entity pair or conflicts
        between graph edges and wiki chunk content.
      tags: [Governance]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { name: space_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Knowledge conflicts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/KnowledgeConflict' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  # ===== Phase 4: MCP Gateway (Stage 14) =====

  # --- API Tokens ---
  /admin/api-tokens:
    post:
      summary: Create API token
      description: |
        Generate a new API token with specified scopes. The raw token is returned
        only once in the response; subsequent queries return masked values.
      tags: [ApiTokens]
      parameters:
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateApiTokenRequest' }
      responses:
        '201':
          description: Token created (raw token returned only once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ApiTokenCreated' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      summary: List API tokens
      tags: [ApiTokens]
      parameters:
        - name: include_revoked
          in: query
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200':
          description: API tokens (masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiToken' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/api-tokens/{token_id}:
    delete:
      summary: Revoke API token
      description: Sets revoked_at timestamp. Token becomes immediately unusable.
      tags: [ApiTokens]
      parameters:
        - { name: token_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      revoked_at: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # --- MCP Tools ---
  /admin/mcp/tools:
    post:
      summary: Register MCP tool
      tags: [MCP]
      parameters:
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMcpToolRequest' }
      responses:
        '201':
          description: Tool registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/McpTool' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409':
          description: Tool name conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      summary: List MCP tools
      tags: [MCP]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled] } }
      responses:
        '200':
          description: MCP tools
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/McpTool' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/mcp/tools/{tool_id}:
    delete:
      summary: Delete MCP tool
      tags: [MCP]
      parameters:
        - { name: tool_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tool deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      deleted: { type: boolean }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /admin/mcp/tools/{tool_id}/policy:
    put:
      summary: Set MCP tool access policy
      description: |
        Configure role-based access, scope requirements, and rate limits for a tool.
        Unauthenticated or unauthorized calls return 403.
      tags: [MCP]
      parameters:
        - { name: tool_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/McpToolPolicy' }
      responses:
        '200':
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/McpTool' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # --- MCP Invoke ---
  /mcp/invoke:
    post:
      summary: Invoke MCP tool
      tags: [MCP]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool, arguments, space_id]
              properties:
                tool: { type: string }
                arguments: { type: object }
                space_id: { type: string }
      responses:
        '200':
          description: Tool execution result
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '429': { $ref: '#/components/responses/RateLimitError' }
