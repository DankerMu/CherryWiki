openapi: 3.1.0
info:
  title: CherryGraph Studio API
  version: 0.2.0
servers:
  - url: /api
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        meta:
          type: object
          properties:
            request_id: { type: string }
    Space:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        docmost_space_id: { type: string }
        wiki_repo_path: { type: string }
        index_consistency_status:
          type: string
          enum: [healthy, checking, inconsistent]
    WikiPage:
      type: object
      properties:
        id: { type: string }
        space_id: { type: string }
        page_id: { type: string }
        title: { type: string }
        status: { type: string }
        current_version_id: { type: string }
        indexed_version_id: { type: string }
        sync_status: { type: string }
    GraphifyRun:
      type: object
      properties:
        id: { type: string }
        space_id: { type: string }
        trigger_type: { type: string }
        mode: { type: string }
        status: { type: string }
        graph_json_uri: { type: string }
        report_uri: { type: string }
        schema_version: { type: string }
    ChatCompletionRequest:
      type: object
      required: [model_id, message, space_ids]
      properties:
        conversation_id: { type: string }
        model_id: { type: string }
        space_ids:
          type: array
          items: { type: string }
        message: { type: string }
        retrieval_mode:
          type: string
          enum: [wiki_only, graph_rag, path_first, community_first]
        include_graph_explanation: { type: boolean }
        stream: { type: boolean }
    DocmostPageSavedEvent:
      type: object
      required: [event_id, docmost_space_id, docmost_page_id, updated_at, content_hash]
      properties:
        event_id: { type: string }
        docmost_space_id: { type: string }
        docmost_page_id: { type: string }
        actor_id: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
        content_hash: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              attachment_id: { type: string }
              filename: { type: string }
              size_bytes: { type: integer }
    DocmostAttachmentEvent:
      type: object
      required: [event_id, docmost_space_id, docmost_page_id, attachment_id, filename]
      properties:
        event_id: { type: string }
        docmost_space_id: { type: string }
        docmost_page_id: { type: string }
        attachment_id: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        download_url: { type: string }
paths:
  /auth/me:
    get:
      summary: Get current user
      responses:
        '200': { description: Current user }
  /spaces:
    get:
      summary: List accessible spaces
      responses:
        '200': { description: Spaces }
    post:
      summary: Create space
      responses:
        '201': { description: Created }
  /spaces/{space_id}/uploads:
    post:
      summary: Upload source document
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Uploaded }
  /spaces/{space_id}/wiki/pages:
    get:
      summary: List wiki pages
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Wiki pages }
  /spaces/{space_id}/wiki/pages/{page_id}:
    get:
      summary: Get wiki page with current and indexed versions
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { name: page_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Wiki page }
  /spaces/{space_id}/wiki/pages/{page_id}/versions:
    get:
      summary: List wiki page versions
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { name: page_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Versions }
  /spaces/{space_id}/wiki/pages/{page_id}/publish:
    post:
      summary: Publish wiki page version
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { name: page_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Published }
  /spaces/{space_id}/wiki/pages/{page_id}/reindex:
    post:
      summary: Reindex wiki page
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { name: page_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Reindex job created }
  /spaces/{space_id}/wiki/consistency:
    get:
      summary: Get space consistency status
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Consistency status }
  /spaces/{space_id}/graphify/runs:
    post:
      summary: Create Graphify run
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '201': { description: Created }
  /graphify/runs/{run_id}:
    get:
      summary: Get Graphify run
      parameters:
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Graphify run }
  /graph/path:
    post:
      summary: Query graph path
      responses:
        '200': { description: Graph paths }
  /graph/nodes:
    get:
      summary: Search graph nodes
      responses:
        '200': { description: Graph nodes }
  /chat/completions:
    post:
      summary: Chat completion with GraphRAG
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200': { description: Completion or SSE stream }
  /admin/users:
    get:
      summary: List users
      responses:
        '200': { description: Users }
    post:
      summary: Create user
      responses:
        '201': { description: Created }
  /admin/groups:
    get:
      summary: List groups
      responses:
        '200': { description: Groups }
    post:
      summary: Create group
      responses:
        '201': { description: Created }
  /admin/models:
    get:
      summary: List model configs
      responses:
        '200': { description: Models }
    post:
      summary: Create model config
      responses:
        '201': { description: Created }
  /admin/graphify/runs:
    get:
      summary: List Graphify runs
      responses:
        '200': { description: Runs }
  /admin/graphify/runs/{run_id}/retry:
    post:
      summary: Retry Graphify run
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Retry job created }
  /admin/consistency-checks:
    get:
      summary: List consistency checks
      responses:
        '200': { description: Checks }
  /admin/spaces/{space_id}/rebuild-index:
    post:
      summary: Rebuild space index
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
      responses:
        '202': { description: Rebuild job created }
  /admin/retrieval-traces/{trace_id}:
    get:
      summary: Get retrieval trace
      parameters:
        - { name: trace_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Trace }
  # Cherry API 接收 Docmost 事件（Docmost → Cherry API）
  /internal/docmost/events/page-saved:
    post:
      summary: Docmost 页面保存事件（Docmost Fork POST 到此）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocmostPageSavedEvent' }
      responses:
        '200': { description: Accepted }
  /internal/docmost/events/page-deleted:
    post:
      summary: Docmost 页面删除事件
      security: []
      responses:
        '200': { description: Accepted }
  /internal/docmost/events/attachment-created:
    post:
      summary: Docmost 附件创建事件
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocmostAttachmentEvent' }
      responses:
        '200': { description: Accepted }
  # 以下为 Docmost Fork 暴露的 Bridge 能力（Cherry API → Docmost Fork）
  # 运行在 Docmost 服务上，此处仅做契约文档化，实际 base URL 为 ${DOCMOST_BASE_URL}/api
  /internal/bridge/pages/{docmost_page_id}/export:
    get:
      summary: 从 Docmost Fork 导出页面 Markdown
      security: []
      parameters:
        - { name: docmost_page_id, in: path, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, default: markdown } }
      responses:
        '200': { description: Page content }
  /internal/bridge/pages/{docmost_page_id}/import:
    put:
      summary: 向 Docmost Fork 导入/更新页面
      security: []
      parameters:
        - { name: docmost_page_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Import accepted }
  /internal/bridge/attachments/{attachment_id}/download:
    get:
      summary: 从 Docmost Fork 下载附件
      security: []
      parameters:
        - { name: attachment_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Attachment binary }
  /internal/bridge/spaces/{docmost_space_id}/sync-status:
    get:
      summary: 查询 Docmost Space 同步状态
      security: []
      parameters:
        - { name: docmost_space_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Sync status }
  /internal/bridge/health:
    get:
      summary: Bridge 健康检查
      security: []
      responses:
        '200': { description: Healthy }
