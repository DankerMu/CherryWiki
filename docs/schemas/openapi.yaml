openapi: 3.1.0
info:
  title: CherryGraph Studio API
  version: 0.5.0
  description: |
    CherryGraph Studio — 知识图谱驱动的 Wiki + RAG Chat 平台。
    所有写入类接口支持 X-Idempotency-Key header（24h 去重窗口）。
servers:
  - url: /api
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    bridgeBearer:
      type: http
      scheme: bearer
      description: DOCMOST_BRIDGE_SECRET as Bearer token for internal Bridge endpoints
    bridgeHmacAuth:
      type: apiKey
      in: header
      name: X-Bridge-Signature
      description: HMAC-SHA256(payload, DOCMOST_BRIDGE_SECRET)
    workerApiKey:
      type: apiKey
      in: header
      name: X-Worker-Key
      description: WORKER_API_KEY for internal Worker-to-API endpoints

  parameters:
    pageParam:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
      description: Page number (1-based)
    perPageParam:
      name: per_page
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      description: Items per page
    sortParam:
      name: sort
      in: query
      schema: { type: string, default: "-created_at" }
      description: "Sort field. Prefix '-' for descending."
    idempotencyKey:
      name: X-Idempotency-Key
      in: header
      schema: { type: string, format: uuid }
      description: Client-generated UUID for idempotent writes (24h dedup window)
    bridgeEventId:
      name: X-Bridge-Event-Id
      in: header
      required: true
      schema: { type: string }
      description: Unique event ID for idempotent processing
    bridgeTimestamp:
      name: X-Bridge-Timestamp
      in: header
      required: true
      schema: { type: string, format: date-time }
      description: Event timestamp for replay attack prevention
    bridgeNonce:
      name: X-Bridge-Nonce
      in: header
      required: true
      schema: { type: string }
      description: Random nonce for replay attack prevention

  schemas:
    # --- Common ---
    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        has_next: { type: boolean }

    Meta:
      type: object
      properties:
        request_id: { type: string }
        pagination: { $ref: '#/components/schemas/Pagination' }

    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
        meta: { $ref: '#/components/schemas/Meta' }

    # --- Auth ---
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    BrowserLoginResponse:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }
        user:
          type: object
          required: [id, email, name, role, groups]
          properties:
            id: { type: string }
            email: { type: string, format: email }
            name: { type: string }
            role: { type: string, enum: [owner, admin, space_admin, editor, viewer, auditor] }
            groups:
              type: array
              items: { type: string }

    BrowserRefreshResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token: { type: string }
        expires_in: { type: integer }

    # --- User ---
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [owner, admin, space_admin, editor, viewer, auditor] }
        status: { type: string, enum: [active, invited, disabled] }
        groups:
          type: array
          items: { $ref: '#/components/schemas/GroupRef' }
        spaces:
          type: array
          items: { $ref: '#/components/schemas/SpaceRef' }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    GroupRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }

    SpaceRef:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }

    CreateUserRequest:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, space_admin, editor, viewer, auditor] }
        groups: { type: array, items: { type: string } }
        send_invite: { type: boolean, default: true }

    # --- Space ---
    Space:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        docmost_space_id: { type: string }
        wiki_repo_path: { type: string }
        index_consistency_status: { type: string, enum: [healthy, checking, inconsistent] }
        config: { $ref: '#/components/schemas/SpaceConfig' }
        stats: { $ref: '#/components/schemas/SpaceStats' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SpaceConfig:
      type: object
      properties:
        auto_graphify: { type: boolean }
        graphify_schedule: { type: string, enum: [on_change, daily, manual] }
        default_retrieval_mode: { type: string, enum: [wiki_only, hybrid_text, graph_rag, path_first, community_first], default: hybrid_text, description: "Phase 1: wiki_only / hybrid_text. Phase 3+: graph_rag / path_first / community_first" }
        database_config:
          type: object
          description: "Phase 3+: Space 内网数据库连接配置。enabled 为 true 时前端显示数据库开关"
          properties:
            enabled: { type: boolean, default: false }
            dsn: { type: string, writeOnly: true, description: "PostgreSQL 只读连接串。writeOnly — 仅管理员写入，GET 响应不返回明文（返回 masked 或省略）" }
            allowed_tables: { type: array, items: { type: string } }
            masked_columns: { type: array, items: { type: string } }
            description: { type: string }
            dsn_masked: { type: string, readOnly: true, description: "GET 响应返回脱敏 DSN（如 postgresql://readonly:***@host/db）" }

    SpaceStats:
      type: object
      properties:
        page_count: { type: integer }
        source_count: { type: integer }
        node_count: { type: integer }
        edge_count: { type: integer }
        community_count: { type: integer }
        pending_ingestion_jobs: { type: integer }
        last_graphify_at: { type: string, format: date-time }

    CreateSpaceRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string, pattern: "^[a-z0-9-]+$" }
        description: { type: string }

    UpdateSpaceRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        config: { $ref: '#/components/schemas/SpaceConfig' }

    # --- Upload ---
    SourceDocument:
      type: object
      properties:
        source_document_id: { type: string }
        space_id: { type: string }
        filename: { type: string }
        title: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        content_hash: { type: string }
        tags: { type: array, items: { type: string } }
        status: { type: string, enum: [uploaded, processing, processed, failed] }
        ingestion_job_id: { type: string }
        chunk_count: { type: integer }
        created_at: { type: string, format: date-time }
        processed_at: { type: string, format: date-time }

    IngestionStatus:
      type: object
      properties:
        source_document_id: { type: string }
        ingestion_job_id: { type: string }
        status: { type: string, enum: [uploaded, processing, processed, failed] }
        progress:
          type: object
          properties:
            stage: { type: string }
            percent: { type: integer, minimum: 0, maximum: 100 }
            current_step: { type: string }
            chunks_created: { type: integer }
        started_at: { type: string, format: date-time }
        estimated_completion: { type: string, format: date-time }

    # --- Graphify ---
    GraphifyRun:
      type: object
      properties:
        run_id: { type: string }
        space_id: { type: string }
        mode: { type: string, enum: [full, update, incremental] }
        trigger_type: { type: string, enum: [manual, scheduled, auto] }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        progress:
          type: object
          properties:
            percent: { type: integer }
            stage: { type: string }
        input_scope:
          type: object
          properties:
            page_ids: { type: array, items: { type: string } }
            source_document_ids: { type: array, items: { type: string } }
        result:
          type: object
          properties:
            nodes_created: { type: integer }
            nodes_updated: { type: integer }
            edges_created: { type: integer }
            wiki_pages_generated: { type: integer }
            schema_version: { type: string }
            graph_json_uri: { type: string }
            report_uri: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    CreateGraphifyRunRequest:
      type: object
      required: [mode, trigger_type]
      properties:
        mode: { type: string, enum: [full, update, incremental] }
        trigger_type: { type: string, enum: [manual, scheduled, auto] }
        input_scope:
          type: object
          properties:
            page_ids: { type: array, items: { type: string } }
            source_document_ids: { type: array, items: { type: string } }
        options:
          type: object
          properties:
            wiki: { type: boolean, default: true }
            no_viz: { type: boolean, default: false }
            directed: { type: boolean, default: false }

    # --- Wiki ---
    WikiPage:
      type: object
      properties:
        page_id: { type: string }
        space_id: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        source: { type: string, enum: [graphify, human, import] }
        current_version_id: { type: string }
        indexed_version_id: { type: string }
        sync_status: { type: string, enum: [synced, pending, conflict] }
        docmost_page_id: { type: string }
        tags: { type: array, items: { type: string } }
        citations_count: { type: integer }
        related_nodes_count: { type: integer }
        updated_at: { type: string, format: date-time }

    WikiPageVersion:
      type: object
      properties:
        version_id: { type: string }
        content_hash: { type: string }
        author: { type: string }
        source_run_id: { type: string }
        status: { type: string, enum: [current, archived] }
        created_at: { type: string, format: date-time }

    PublishRequest:
      type: object
      required: [version_id]
      properties:
        version_id: { type: string }
        publish_note: { type: string }

    RollbackRequest:
      type: object
      required: [target_version_id]
      properties:
        target_version_id: { type: string }
        reason: { type: string }

    Citation:
      type: object
      properties:
        citation_id: { type: string }
        source_document_id: { type: string }
        source_title: { type: string }
        chunk_id: { type: string }
        excerpt: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        page_section: { type: string }

    # --- Graph ---
    GraphNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        type: { type: string }
        space_id: { type: string }
        degree: { type: integer }
        community_id: { type: string }
        properties: { type: object }

    GraphEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        relation: { type: string }
        weight: { type: number }

    GraphPath:
      type: object
      properties:
        path_id: { type: string }
        hops: { type: integer }
        total_weight: { type: number }
        nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/GraphEdge' } }

    PathQueryRequest:
      type: object
      required: [space_ids, source_label, target_label]
      properties:
        space_ids: { type: array, items: { type: string } }
        source_label: { type: string }
        target_label: { type: string }
        max_hops: { type: integer, default: 4, maximum: 10 }
        include_inferred: { type: boolean, default: true }
        include_ambiguous: { type: boolean, default: false }

    GraphQueryRequest:
      type: object
      required: [space_ids, query]
      properties:
        space_ids: { type: array, items: { type: string } }
        query: { type: string }
        max_results: { type: integer, default: 10 }

    Community:
      type: object
      properties:
        community_id: { type: string }
        label: { type: string }
        space_id: { type: string }
        node_count: { type: integer }
        density: { type: number }
        top_nodes: { type: array, items: { $ref: '#/components/schemas/GraphNode' } }

    # --- Chat ---
    ChatCompletionRequest:
      type: object
      required: [model_id, message, space_ids]
      properties:
        conversation_id: { type: string }
        model_id: { type: string }
        space_ids: { type: array, items: { type: string } }
        message: { type: string, maxLength: 32000 }
        retrieval_mode:
          type: string
          enum: [wiki_only, hybrid_text, graph_rag, path_first, community_first, debug]
          default: hybrid_text
          description: "Phase 1: wiki_only / hybrid_text. Phase 3+: graph_rag / path_first / community_first / debug（走 Agent 深度路径）"
        include_graph_explanation: { type: boolean, default: false }
        enable_database:
          type: boolean
          default: false
          description: "Phase 3+: 开启后允许 Agent 查询内网数据库。仅当 Space 配置了 database_config 时有效"
        enable_deep_analysis:
          type: boolean
          default: false
          description: "Phase 3+: 开启后强制走 Claude Code Agent 深度路径"
        stream: { type: boolean, default: true }
        options:
          type: object
          properties:
            temperature: { type: number, minimum: 0, maximum: 2, default: 0.7 }
            max_tokens: { type: integer, default: 2048 }

    ChatCompletionResponse:
      type: object
      properties:
        message_id: { type: string }
        conversation_id: { type: string }
        content: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        graph_paths:
          type: array
          items: { $ref: '#/components/schemas/GraphPath' }
        tokens_used:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }

    # --- SSE Event Schemas ---
    SSEEventBase:
      type: object
      description: Common metadata present in every SSE event data payload
      required: [request_id, conversation_id, message_id, seq, timestamp]
      properties:
        request_id: { type: string, description: "Request unique ID" }
        conversation_id: { type: string, description: "Conversation ID" }
        message_id: { type: string, description: "Reply message ID (assigned in first event)" }
        seq: { type: integer, minimum: 1, description: "Monotonic sequence number for reconnect recovery" }
        timestamp: { type: string, format: date-time, description: "ISO 8601 with millisecond precision" }

    SSERetrievalStarted:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            query_id: { type: string }
            retrieval_mode: { type: string, enum: [wiki_only, hybrid_text, graph_rag, path_first, community_first, debug] }

    SSERetrievalCompleted:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            query_id: { type: string }
            chunks_retrieved: { type: integer }
            paths_found: { type: integer }

    SSERetrievalFailed:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            error_code: { type: string }
            message: { type: string }
            fallback: { type: string, enum: [no_rag, terminate], description: "no_rag=continue without RAG, terminate=abort stream" }

    SSERerankCompleted:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            query_id: { type: string }
            final_chunks: { type: integer }
            rerank_model: { type: string }

    SSEMessageDelta:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          required: [text]
          properties:
            text: { type: string }

    SSECitationAdded:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            citation_id: { type: string }
            page_id: { type: string }
            section_id: { type: string }
            excerpt: { type: string }

    SSEGraphPathAdded:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            path_id: { type: string }
            nodes: { type: array, items: { type: string } }
            relations: { type: array, items: { type: string } }

    SSEMessageCompleted:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            finish_reason: { type: string, enum: [stop, max_tokens, content_filter] }

    SSEMessageError:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          required: [error_code, message]
          properties:
            error_code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            retry_after_ms: { type: integer }

    SSEChartData:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          description: "Phase 3+: Agent 通过 cherrydb chart 输出的 ECharts 图表数据"
          required: [chart_type, echarts_option]
          properties:
            chart_type: { type: string, enum: [bar, line, pie] }
            echarts_option: { type: object, description: "完整 ECharts 配置 JSON" }

    SSEAgentToolUse:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          description: "Phase 3+: Agent 正在调用工具（仅深度路径）"
          required: [tool_name]
          properties:
            tool_name: { type: string, description: "如 cherrydb query / graphify query / cherrywiki search" }
            tool_input: { type: string, description: "工具参数摘要" }

    SSEUsageReported:
      allOf:
        - { $ref: '#/components/schemas/SSEEventBase' }
        - type: object
          properties:
            tokens_used:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
                retrieval: { type: integer }
            latency_ms:
              type: object
              properties:
                retrieval: { type: integer }
                rerank: { type: integer }
                generation: { type: integer }
                total: { type: integer }

    # --- Admin ---
    Group:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        member_count: { type: integer }
        spaces:
          type: array
          items:
            type: object
            properties:
              space_id: { type: string }
              role: { type: string }
        created_at: { type: string, format: date-time }

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        member_ids: { type: array, items: { type: string } }
        space_permissions:
          type: array
          items:
            type: object
            required: [space_id, role]
            properties:
              space_id: { type: string }
              role: { type: string, enum: [viewer, editor, space_admin] }

    ModelConfig:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string, enum: [openai, anthropic, azure, local] }
        status: { type: string, enum: [active, disabled] }
        config:
          type: object
          properties:
            endpoint: { type: string }
            api_key_ref: { type: string }
            max_tokens: { type: integer }
            supports_streaming: { type: boolean }
        allowed_roles: { type: array, items: { type: string } }

    CreateModelRequest:
      type: object
      required: [name, provider, config]
      properties:
        name: { type: string }
        provider: { type: string, enum: [openai, anthropic, azure, local] }
        config:
          type: object
          required: [endpoint, api_key_ref]
          properties:
            endpoint: { type: string }
            api_key_ref: { type: string }
            max_tokens: { type: integer }
            supports_streaming: { type: boolean }
        allowed_roles: { type: array, items: { type: string } }

    AuditLog:
      type: object
      properties:
        audit_id: { type: string }
        action: { type: string }
        actor_id: { type: string }
        actor_name: { type: string }
        space_id: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        details: { type: object }
        ip: { type: string }
        timestamp: { type: string, format: date-time }

    Job:
      type: object
      properties:
        job_id: { type: string }
        type: { type: string, enum: [ingestion, graphify, reindex, rebuild, wiki_sync] }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        space_id: { type: string }
        progress:
          type: object
          properties:
            percent: { type: integer }
            stage: { type: string }
        created_by: { type: string }
        payload_json: { type: object }
        result_json: { type: object }
        error_json: { type: object }
        cancel_requested_at: { type: string, format: date-time }
        attempt_count: { type: integer }
        max_attempts: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    SystemHealth:
      type: object
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        version: { type: string }
        uptime_seconds: { type: integer }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [healthy, degraded, unhealthy] }
              latency_ms: { type: integer }
        queues:
          type: object
          additionalProperties:
            type: object
            properties:
              pending: { type: integer }
              processing: { type: integer }

    RetrievalTrace:
      type: object
      properties:
        trace_id: { type: string }
        query: { type: string }
        retrieval_mode: { type: string }
        stages:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              duration_ms: { type: integer }
              output: { type: object }
        total_duration_ms: { type: integer }
        created_at: { type: string, format: date-time }

    # --- Bridge Events ---
    DocmostPageSavedEvent:
      type: object
      required: [event_id, docmost_space_id, docmost_page_id, updated_at, content_hash]
      properties:
        event_id: { type: string }
        docmost_space_id: { type: string }
        docmost_page_id: { type: string }
        actor_id: { type: string }
        title: { type: string }
        updated_at: { type: string, format: date-time }
        content_hash: { type: string }
        attachments:
          type: array
          items:
            type: object
            properties:
              attachment_id: { type: string }
              filename: { type: string }
              size_bytes: { type: integer }

    DocmostAttachmentEvent:
      type: object
      required: [event_id, docmost_space_id, docmost_page_id, attachment_id, filename]
      properties:
        event_id: { type: string }
        docmost_space_id: { type: string }
        docmost_page_id: { type: string }
        attachment_id: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        download_url: { type: string }

    # --- Supplemental Schemas (Section 14) ---
    PasswordChangeRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8 }

    Session:
      type: object
      properties:
        id: { type: string }
        ip: { type: string }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        is_current: { type: boolean }

    JobEvent:
      type: object
      properties:
        event: { type: string }
        timestamp: { type: string, format: date-time }
        detail: { type: object }

    WikiPageContent:
      type: object
      properties:
        page_id: { type: string }
        version_id: { type: string }
        title: { type: string }
        content_markdown: { type: string }
        content_hash: { type: string }
        blocks:
          type: array
          items:
            type: object
            properties:
              block_id: { type: string }
              owner: { type: string, enum: [graphify, human] }
              editable: { type: boolean }

    ProposalAcceptRequest:
      type: object
      properties:
        merge_strategy: { type: string, enum: [auto, manual], default: auto }
        publish_note: { type: string }

    ProposalRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    ProposalResponse:
      type: object
      properties:
        proposal_id: { type: string }
        status: { type: string, enum: [accepted, rejected] }
        new_version_id: { type: string }
        merged_at: { type: string, format: date-time }
        rejected_at: { type: string, format: date-time }

    UpdateModelRequest:
      type: object
      properties:
        status: { type: string, enum: [active, disabled] }
        config:
          type: object
          properties:
            endpoint: { type: string }
            api_key_ref: { type: string }
            max_tokens: { type: integer }
            supports_streaming: { type: boolean }
        allowed_roles: { type: array, items: { type: string } }

    ModelTestRequest:
      type: object
      properties:
        test_prompt: { type: string, default: "Hello" }

    ModelTestResponse:
      type: object
      properties:
        model_id: { type: string }
        reachable: { type: boolean }
        latency_ms: { type: integer }
        response_preview: { type: string }
        error: { type: [string, 'null'] }

    # --- Phase 4: Feedback ---
    FeedbackItem:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        message_id: { type: string }
        space_id: { type: string }
        feedback_type: { type: string, enum: [incorrect, missing, outdated, citation_error, other] }
        status: { type: string, enum: [open, in_review, resolved, rejected] }
        payload_json: { type: object }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string }
        resolution_note: { type: string }

    CreateFeedbackRequest:
      type: object
      required: [feedback_type]
      properties:
        feedback_type: { type: string, enum: [incorrect, missing, outdated, citation_error, other] }
        message_id: { type: string, description: "Chat message being reported (optional)" }
        page_id: { type: string, description: "Wiki page being reported (optional)" }
        description: { type: string, maxLength: 4000 }
        payload_json: { type: object }

    ResolveFeedbackRequest:
      type: object
      required: [resolution]
      properties:
        resolution: { type: string, enum: [accepted, resolved, rejected] }
        notes: { type: string, description: "Resolution notes from admin" }
        action: { type: string, enum: [edit, ignore, defer], description: "edit triggers reindex after associated page edit" }

    # --- Phase 4: Governance ---
    GovernanceEdge:
      type: object
      properties:
        edge_id: { type: string }
        space_id: { type: string }
        source_node:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
            type: { type: string }
        target_node:
          type: object
          properties:
            id: { type: string }
            label: { type: string }
            type: { type: string }
        relation_type: { type: string }
        confidence_label: { type: string, enum: [CONFIRMED, INFERRED, AMBIGUOUS, LOW, REJECTED] }
        effective_confidence_score: { type: number }
        raw_confidence_score: { type: number }
        evidence_count: { type: integer }
        review_status: { type: string, enum: [pending, approved, rejected] }
        created_at: { type: string, format: date-time }

    ReviewEdgeRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [confirm, reject] }
        effective_score: { type: number, minimum: 0, maximum: 1, description: "Override effective_confidence_score when action=confirm" }
        reason: { type: string }
        new_confidence_label: { type: string, enum: [EXTRACTED, CONFIRMED, INFERRED, AMBIGUOUS, LOW], description: "Only used when action=confirm; defaults to EXTRACTED" }

    DuplicateSuggestion:
      type: object
      properties:
        suggestion_id: { type: string }
        space_id: { type: string }
        node_a:
          type: object
          properties:
            stable_key: { type: string }
            label: { type: string }
            type: { type: string }
            wiki_page_id: { type: string }
        node_b:
          type: object
          properties:
            stable_key: { type: string }
            label: { type: string }
            type: { type: string }
            wiki_page_id: { type: string }
        similarity_score: { type: number }
        reason: { type: string }

    MergeNodesRequest:
      type: object
      required: [from_page_id, to_page_id, reason]
      properties:
        from_page_id: { type: string, description: "Source page to merge from" }
        to_page_id: { type: string, description: "Target page to merge into" }
        reason: { type: string }
        merge_wiki_pages: { type: boolean, default: true, description: "Also merge associated wiki pages" }

    NodeMergeResult:
      type: object
      properties:
        merge_id: { type: string }
        from_stable_key: { type: string }
        to_stable_key: { type: string }
        edges_redirected: { type: integer }
        wiki_pages_merged: { type: integer }
        reindex_job_id: { type: string }
        created_at: { type: string, format: date-time }

    KnowledgeConflict:
      type: object
      properties:
        conflict_id: { type: string }
        space_id: { type: string }
        conflict_type: { type: string, enum: [contradictory_edges, edge_chunk_mismatch] }
        entity_pair:
          type: object
          properties:
            source_label: { type: string }
            target_label: { type: string }
        conflicting_items:
          type: array
          items:
            type: object
            properties:
              item_type: { type: string, enum: [edge, chunk] }
              item_id: { type: string }
              relation_or_content: { type: string }
              confidence: { type: number }
        severity: { type: string, enum: [high, medium, low] }
        detected_at: { type: string, format: date-time }

    # --- Phase 4: API Tokens ---
    ApiToken:
      type: object
      required: [id, name, token_prefix, scopes, last_used_at, expires_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        token_prefix: { type: string, description: "First 8 chars of the token for identification" }
        scopes: { type: array, items: { type: string } }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    ApiTokenCreated:
      type: object
      required: [id, name, raw_token, token_prefix, scopes, last_used_at, expires_at, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        raw_token: { type: string, description: "Full token — shown only once at creation" }
        token_prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    CreateApiTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes: { type: array, items: { type: string }, description: "REST permissions require same-named scopes, e.g. admin:user_manage, upload:create, graphify:run. MCP scopes such as mcp:invoke are MCP-only." }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, description: "Token TTL in days; omit for non-expiring" }

    # --- Phase 4: MCP ---
    McpTool:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        server_url: { type: string }
        transport: { type: string, enum: [sse, stdio] }
        scopes: { type: array, items: { type: string } }
        input_schema: { type: object, description: "JSON Schema for tool input" }
        status: { type: string, enum: [active, disabled] }
        policy: { $ref: '#/components/schemas/McpToolPolicy' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateMcpToolRequest:
      type: object
      required: [name, description, server_url]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_-]{1,63}$" }
        description: { type: string }
        server_url: { type: string, format: uri }
        transport: { type: string, enum: [sse, stdio], default: sse }
        scopes: { type: array, items: { type: string }, description: "Required scopes for this tool" }
        input_schema: { type: object }
        status: { type: string, enum: [active, disabled], default: active }

    McpToolPolicy:
      type: object
      properties:
        allowed_roles: { type: array, items: { type: string, enum: [owner, admin, space_admin, editor, viewer] } }
        allowed_scopes: { type: array, items: { type: string }, description: "Required API token scopes" }
        rate_limit:
          type: object
          properties:
            requests_per_minute: { type: integer, minimum: 1 }
            requests_per_hour: { type: integer, minimum: 1 }
        require_approval: { type: boolean, default: false, description: "If true, invocations require admin approval" }

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Invalid request parameters
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimitError:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

paths:
  # --- Auth ---
  /auth/login:
    post:
      summary: Login
      description: Browser login returns an access token in the JSON body and sets the refresh token as an HttpOnly `refresh_token` cookie.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful. The refresh token is set in the `Set-Cookie` header and is not included in the JSON body.
          headers:
            Set-Cookie:
              description: HttpOnly `refresh_token` cookie scoped to `/api/auth`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BrowserLoginResponse' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '429': { $ref: '#/components/responses/RateLimitError' }

  /auth/logout:
    post:
      summary: Logout
      description: Browser logout revokes the refresh session identified by the `refresh_token` cookie when present and clears that cookie. The request body is empty.
      tags: [Auth]
      responses:
        '200':
          description: Logged out. The refresh cookie is cleared even when no refresh cookie was present.
          headers:
            Set-Cookie:
              description: Expired HttpOnly `refresh_token` cookie.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success: { type: boolean }

  /auth/me:
    get:
      summary: Get current user
      tags: [Auth]
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /auth/refresh:
    post:
      summary: Refresh token
      description: Browser refresh reads the HttpOnly `refresh_token` cookie, rotates it, and returns only a new access token in the JSON body. No JSON request body is required or used.
      tags: [Auth]
      security: []
      responses:
        '200':
          description: Token refreshed. The rotated refresh token is set in the `Set-Cookie` header and is not included in the JSON body.
          headers:
            Set-Cookie:
              description: Rotated HttpOnly `refresh_token` cookie scoped to `/api/auth`.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BrowserRefreshResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /auth/password/change:
    post:
      summary: Change password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/sessions:
    get:
      summary: List active sessions
      tags: [Auth]
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Session' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /auth/sessions/{session_id}:
    delete:
      summary: Revoke session
      tags: [Auth]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked: { type: boolean }
        '404': { $ref: '#/components/responses/NotFoundError' }

  # --- Space ---
  /spaces:
    get:
      summary: List accessible spaces
      tags: [Space]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { $ref: '#/components/parameters/sortParam' }
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: List of spaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Space' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      summary: Create space
      tags: [Space]
      parameters:
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSpaceRequest' }
      responses:
        '201':
          description: Space created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Space' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409':
          description: Slug conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /spaces/{space_id}:
    get:
      summary: Get space details
      tags: [Space]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Space details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Space' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      summary: Update space
      tags: [Space]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSpaceRequest' }
      responses:
        '200':
          description: Space updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Space' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /spaces/{space_id}/stats:
    get:
      summary: Get space statistics
      tags: [Space]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Space stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SpaceStats' }

  # --- Upload ---
  /spaces/{space_id}/uploads:
    post:
      summary: Upload source document
      tags: [Upload]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "Max 50MB" }
                title: { type: string }
                tags: { type: array, items: { type: string } }
                auto_graphify: { type: boolean, default: false }
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: "URL to fetch (source_type=url)" }
                title: { type: string }
                tags: { type: array, items: { type: string } }
                auto_graphify: { type: boolean, default: false }
      responses:
        '201':
          description: Document uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SourceDocument' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '413':
          description: File too large
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Validation error or security rejection
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ErrorResponse' }
                  - type: object
                    properties:
                      code:
                        type: string
                        enum: [SSRF_BLOCKED, MIME_MISMATCH, ZIP_BOMB_DETECTED, PATH_TRAVERSAL_DETECTED, ZIP_NESTING_EXCEEDED, UNSUPPORTED_FILE_TYPE]
        '429': { $ref: '#/components/responses/RateLimitError' }

  /uploads/{source_document_id}:
    get:
      summary: Get source document
      tags: [Upload]
      parameters:
        - { name: source_document_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Source document details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SourceDocument' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /uploads/{source_document_id}/status:
    get:
      summary: Get ingestion status
      tags: [Upload]
      parameters:
        - { name: source_document_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ingestion progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/IngestionStatus' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /uploads/{source_document_id}/reprocess:
    post:
      summary: Reprocess source document
      tags: [Upload]
      parameters:
        - { name: source_document_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Reprocess initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SourceDocument' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Reprocess already running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # --- Jobs (User-level) ---
  /jobs/{job_id}:
    get:
      summary: Get job status
      tags: [Jobs]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /jobs/{job_id}/events:
    get:
      summary: Get job events
      tags: [Jobs]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JobEvent' } }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /jobs/{job_id}/cancel:
    post:
      summary: Cancel job
      description: |
        Pending jobs are cancelled immediately (status→cancelled).
        Running jobs receive cancel_requested_at; actual cancellation occurs
        when the Worker acknowledges via heartbeat or next progress report.
        Repeated cancel on the same job is idempotent and returns the current state.
      tags: [Jobs]
      parameters:
        - { name: job_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancel accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string }
                      status: { type: string, enum: [cancelled, running] }
                      cancel_requested_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409':
          description: Job in terminal state (succeeded/failed), not cancellable. Already-cancelled jobs return 200 idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # --- Graphify ---
  /spaces/{space_id}/graphify/runs:
    post:
      summary: Create Graphify run
      tags: [Graphify]
      parameters:
        - { name: space_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateGraphifyRunRequest' }
      responses:
        '201':
          description: Graphify run created
          content:
            application/json:
              schema:
