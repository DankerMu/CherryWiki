  # --- Chat ---
  /chat/completions:
    post:
      summary: Chat completion with GraphRAG
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: Completion (JSON for non-stream, SSE for stream)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChatCompletionResponse' }
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream. Each event data payload includes common metadata:
                  request_id, conversation_id, message_id, seq (monotonic sequence for reconnect), timestamp.
                  Events: retrieval.started, retrieval.completed, retrieval.failed,
                  rerank.completed, message.delta, citation.added, graph_path.added,
                  message.completed, message.error, usage.reported,
                  chart.data (Phase 3+), agent.tool_use (Phase 3+).
                  Reconnect via Last-Event-ID: {message_id}:{seq} header.
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimitError' }

