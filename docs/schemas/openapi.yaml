        - { name: status, in: query, schema: { type: string } }
      responses:
        '200':
          description: All runs (no space permission filter)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/GraphifyRun' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/graphify/runs/{run_id}/retry:
    post:
      summary: Retry Graphify run (admin)
      tags: [Admin]
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/idempotencyKey' }
      responses:
        '202':
          description: Retry job created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GraphifyRun' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /admin/consistency-checks:
    get:
      summary: List consistency checks
      tags: [Admin]
