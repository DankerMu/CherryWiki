        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/jobs:
    get:
      summary: List jobs
      tags: [Admin]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
        - { $ref: '#/components/parameters/sortParam' }
        - { name: type, in: query, schema: { type: string, enum: [ingestion, graphify, reindex, rebuild, wiki_sync] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, running, succeeded, failed, cancelled] } }
        - { name: space_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Job' } }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/system/health:
    get:
      summary: System health check
      tags: [Admin]
      responses:
        '200':
          description: System health
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SystemHealth' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/graphify/runs:
    get:
      summary: List all Graphify runs (admin)
      tags: [Admin]
      parameters:
        - { $ref: '#/components/parameters/pageParam' }
        - { $ref: '#/components/parameters/perPageParam' }
