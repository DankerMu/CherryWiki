[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cherrywiki"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "click",
]

[project.scripts]
cherrywiki = "cherrywiki.cli:main"

[tool.setuptools]
packages = ["cherrywiki"]
package-dir = { "cherrywiki" = "." }
