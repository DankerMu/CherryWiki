[project]
name = "graphify-worker"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "redis",
  "httpx",
  "aiohttp"
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-asyncio"
]

[project.scripts]
graphify-worker = "src.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]
